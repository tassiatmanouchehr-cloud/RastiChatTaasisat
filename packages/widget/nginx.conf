server {
    listen 8080;
    server_tokens off;

    # Stable, predictable embed URL — every existing `<script src=".../widget.js">`
    # tag on a customer site keeps working across every deploy. Short/no-cache
    # so a new deploy is visible immediately (an always-revalidate GET is cheap
    # for a ~30KB script), trading a little bandwidth for zero-coordination
    # rollouts — nobody has to update their embed snippet when the widget ships
    # a fix.
    location = /widget.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /widget.js =404;
    }

    # Versioned, immutable path for anyone who deliberately wants to pin a
    # specific build (e.g. a customer testing an upgrade before switching
    # their embed snippet over) — safe to cache aggressively since the URL
    # itself changes on every build.
    location ~ ^/widget/[^/]+/widget\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
