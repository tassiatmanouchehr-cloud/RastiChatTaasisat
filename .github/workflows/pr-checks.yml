name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same PR cancels the still-running checks for the
# first — no point finishing a check run against code that's already
# superseded.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rastichat
          POSTGRES_PASSWORD: rastichat_ci_secret
          POSTGRES_DB: rastichat_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rastichat"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "1"
      SECRET_KEY: ci-only-insecure-key-not-used-anywhere-real
      DB_HOST: localhost
      DB_USER: rastichat
      DB_PASSWORD: rastichat_ci_secret
      DB_NAME: rastichat_db
      REDIS_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: manage.py check
        run: python manage.py check
      - name: manage.py check --deploy (informational — dev settings are expected to warn)
        run: python manage.py check --deploy || true
      - name: manage.py check --deploy under staging-like settings (blocking)
        # Unlike the dev-mode run above, this actually exercises the
        # settings.py guardrails a staging/production deploy would hit —
        # a real regression here (e.g. someone reintroducing DEBUG=1 as a
        # default, or dropping a security header) should fail the build,
        # not just get logged.
        run: python manage.py check --deploy
        env:
          ENVIRONMENT: staging
          DEBUG: "0"
          DJANGO_SECRET_KEY: ci-staging-check-only-not-a-real-secret-0123456789
          ALLOWED_HOSTS: ci-staging-check.example.com
          CSRF_TRUSTED_ORIGINS: https://ci-staging-check.example.com
          CORS_ALLOWED_ORIGINS: https://ci-staging-check.example.com
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate
        run: python manage.py migrate
      - name: Test
        run: python manage.py test --verbosity=2
      - name: Bandit (static security scan, medium+ severity fails the build)
        run: bandit -r . -x './*/tests*.py,./*/migrations/*' -ll
      - name: pip-audit (dependency vulnerability scan, fails the build)
        run: pip-audit -r requirements.txt

  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/widget/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - name: npm audit (informational — remaining findings are dev-tooling-only)
        # esbuild/vite/vite-node/vitest findings here are all dev-server/test-UI
        # vulnerabilities in build/test tooling that never ships in the
        # production bundle or runs with any network exposure in CI or
        # production (only `npm run build`/`vitest run` execute here, never
        # `vite dev`/`vitest --ui`) — verified by hand for every frontend
        # package in this repo; a real runtime dependency finding (Next.js
        # itself, previously flagged here until bumped to 16.3.0) is a
        # different story and would need the same scrutiny, not a blanket
        # `|| true`.
        run: npm audit --audit-level=high || true

  operator-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/operator-dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - name: npm audit (informational — remaining findings are dev-tooling-only)
        # esbuild/vite/vite-node/vitest findings here are all dev-server/test-UI
        # vulnerabilities in build/test tooling that never ships in the
        # production bundle or runs with any network exposure in CI or
        # production (only `npm run build`/`vitest run` execute here, never
        # `vite dev`/`vitest --ui`) — verified by hand for every frontend
        # package in this repo; a real runtime dependency finding (Next.js
        # itself, previously flagged here until bumped to 16.3.0) is a
        # different story and would need the same scrutiny, not a blanket
        # `|| true`.
        run: npm audit --audit-level=high || true

  platform-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/platform-dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - name: npm audit (informational — remaining findings are dev-tooling-only)
        # esbuild/vite/vite-node/vitest findings here are all dev-server/test-UI
        # vulnerabilities in build/test tooling that never ships in the
        # production bundle or runs with any network exposure in CI or
        # production (only `npm run build`/`vitest run` execute here, never
        # `vite dev`/`vitest --ui`) — verified by hand for every frontend
        # package in this repo; a real runtime dependency finding (Next.js
        # itself, previously flagged here until bumped to 16.3.0) is a
        # different story and would need the same scrutiny, not a blanket
        # `|| true`.
        run: npm audit --audit-level=high || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.staging.yml
        run: |
          docker compose -f docker-compose.staging.yml config --quiet
        env:
          DB_PASSWORD: ci-placeholder
          NEXT_PUBLIC_API_BASE_URL: https://ci-placeholder.example.com/api/v1
          NEXT_PUBLIC_WS_BASE_URL: wss://ci-placeholder.example.com/ws
      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod -t rastichat-backend:ci backend
      - name: Build widget image
        run: docker build -f docker/widget.Dockerfile -t rastichat-widget:ci packages/widget
      - name: Build operator-dashboard image
        run: |
          docker build -f docker/operator-dashboard.Dockerfile -t rastichat-operator:ci \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://ci-placeholder.example.com/api/v1 \
            --build-arg NEXT_PUBLIC_WS_BASE_URL=wss://ci-placeholder.example.com/ws \
            apps/operator-dashboard
      - name: Build platform-dashboard image
        run: |
          docker build -f docker/platform-dashboard.Dockerfile -t rastichat-platform:ci \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://ci-placeholder.example.com/api/v1 \
            --build-arg NEXT_PUBLIC_WS_BASE_URL=wss://ci-placeholder.example.com/ws \
            apps/platform-dashboard
